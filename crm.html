<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>地產 Lead CRM</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <h1 class="brand">置業快覽</h1>
      <nav class="nav">
        <a href="index.html" class="nav-link">首頁</a>
        <a href="crm.html" class="nav-link">Lead CRM</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px">
      <h2>地產 Lead CRM</h2>
      <div id="authArea" style="display:flex;gap:8px;align-items:center"></div>
    </div>

    <div class="grid stats-grid">
      <div class="stat"><b id="sTotal">0</b><span class="muted">總Lead</span></div>
      <div class="stat"><b id="sA">0</b><span class="muted">A級客</span></div>
      <div class="stat"><b id="sDue">0</b><span class="muted">今日要跟</span></div>
      <div class="stat"><b id="sView">0</b><span class="muted">已睇樓</span></div>
    </div>

    <section class="card">
      <h3>快速新增Lead</h3>
      <div class="formgrid">
        <div>
          <label>稱呼</label>
          <input id="name" />
        </div>
        <div>
          <label>電話</label>
          <input id="phone" />
        </div>
        <div>
          <label>樓盤</label>
          <input id="project" />
        </div>

        <div>
          <label>預算</label>
          <input id="budget" />
        </div>
        <div>
          <label>用途</label>
          <select id="purpose">
            <option>自住</option>
            <option>投資</option>
            <option>未確定</option>
          </select>
        </div>
        <div>
          <label>級別</label>
          <select id="grade">
            <option>A</option>
            <option selected>B</option>
            <option>C</option>
          </select>
        </div>

        <div>
          <label>狀態</label>
          <select id="status">
            <option>新接觸</option>
            <option>已留電話</option>
            <option>已睇樓</option>
            <option>二次跟進</option>
            <option>落票</option>
            <option>成交</option>
            <option>失聯</option>
          </select>
        </div>
        <div>
          <label>下次跟進</label>
          <input id="follow" type="date" />
        </div>
        <div>
          <label>來源</label>
          <input id="source" placeholder="示範單位通道" />
        </div>
      </div>

      <label>備註</label>
      <textarea id="notes"></textarea>
      <button id="addBtn" class="primary" style="width:100%;margin-top:10px">新增Lead</button>
    </section>

    <section class="card">
      <div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap">
        <h3>Lead列表</h3>
        <div>
          <button id="exportBtn" class="secondary">匯出CSV</button>
          <button id="clearBtn" class="danger">清除全部</button>
        </div>
      </div>

      <input id="search" oninput="render()" placeholder="搜尋姓名、電話、樓盤、備註" />
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>客戶</th>
              <th>樓盤／預算</th>
              <th>級別／狀態</th>
              <th>跟進</th>
              <th>備註</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="wrap footer">
    <small>© 2026 置業快覽</small>
  </footer>

  <!-- Firebase (compat) SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <script>
    // --- TODO: Replace with your Firebase config ---
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      // optional: storageBucket, messagingSenderId, appId
    };
    // initialize
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // UI elements
    const authArea = document.getElementById('authArea');
    const addBtn = document.getElementById('addBtn');
    const exportBtn = document.getElementById('exportBtn');
    const clearBtn = document.getElementById('clearBtn');

    // state
    let currentUser = null;
    let isAdmin = false;
    let leadsCache = []; // local cache of fetched leads

    // create auth UI
    function renderAuthUI(user) {
      authArea.innerHTML = '';
      if (!user) {
        const loginBtn = document.createElement('button');
        loginBtn.textContent = '以 Google 登入';
        loginBtn.className = 'primary';
        loginBtn.onclick = () => {
          const provider = new firebase.auth.GoogleAuthProvider();
          auth.signInWithPopup(provider).catch(err => alert(err.message));
        };
        authArea.appendChild(loginBtn);
      } else {
        const span = document.createElement('span');
        span.textContent = user.displayName || user.email;
        span.style.marginRight = '8px';
        authArea.appendChild(span);
        if (isAdmin) {
          const adminBadge = document.createElement('span');
          adminBadge.textContent = 'Admin';
          adminBadge.style.background = '#fde68a';
          adminBadge.style.padding = '6px 8px';
          adminBadge.style.borderRadius = '8px';
          adminBadge.style.fontWeight = '700';
          authArea.appendChild(adminBadge);
        }
        const logoutBtn = document.createElement('button');
        logoutBtn.textContent = '登出';
        logoutBtn.className = '';
        logoutBtn.onclick = () => auth.signOut();
        authArea.appendChild(logoutBtn);
      }
    }

    // auth state listener
    auth.onAuthStateChanged(async user => {
      currentUser = user;
      if (!user) {
        isAdmin = false;
        renderAuthUI(null);
        // show message or hide UI
        document.querySelector('main').classList.add('signed-out');
        // clear table
        leadsCache = [];
        render();
        return;
      }
      // get token result to check custom claims
      try {
        const idTokenResult = await user.getIdTokenResult(true);
        isAdmin = !!(idTokenResult && idTokenResult.claims && idTokenResult.claims.admin);
      } catch (e) {
        console.error('token error', e);
        isAdmin = false;
      }
      renderAuthUI(user);
      fetchLeads();
    });

    // add lead (writes to Firestore)
    async function addLead() {
      if (!currentUser) { alert('請先登入'); return; }
      const g = id => document.getElementById(id).value.trim();
      const doc = {
        created: firebase.firestore.FieldValue.serverTimestamp(),
        name: g('name'),
        phone: g('phone'),
        project: g('project'),
        budget: g('budget'),
        purpose: g('purpose'),
        grade: g('grade'),
        status: g('status'),
        follow: g('follow'),
        source: g('source'),
        notes: g('notes'),
        ownerUid: currentUser.uid,
        ownerName: currentUser.displayName || currentUser.email
      };
      if (!doc.name && !doc.phone) { alert('最少填稱呼或電話'); return; }
      try {
        await db.collection('leads').add(doc);
        // clear inputs
        ['name','phone','project','budget','purpose','grade','status','follow','source','notes'].forEach(id => {
          const el = document.getElementById(id);
          if (el) { if (el.tagName === 'SELECT') el.selectedIndex = 0; else el.value = ''; }
        });
        fetchLeads();
      } catch (e) { alert('新增失敗：'+e.message); }
    }

    // fetch leads: admin sees all, others see only own
    async function fetchLeads() {
      if (!currentUser) return;
      let q;
      if (isAdmin) {
        q = db.collection('leads').orderBy('created','desc').limit(1000);
      } else {
        q = db.collection('leads').where('ownerUid','==', currentUser.uid).orderBy('created','desc');
      }
      try {
        const snap = await q.get();
        leadsCache = snap.docs.map(d => ({ id: d.id, ...d.data(), created: d.data().created ? d.data().created.toDate().toISOString() : '' }));
        render();
      } catch (e) { console.error('fetch error', e); alert('讀取失敗：'+e.message); }
    }

    // remove lead (only allowed by rules if owner or admin)
    async function removeLead(id) {
      if (!currentUser) { alert('請先登入'); return; }
      if (!confirm('刪除？')) return;
      try {
        await db.collection('leads').doc(id).delete();
        fetchLeads();
      } catch (e) { alert('刪除失敗：'+e.message); }
    }

    // advance status
    async function advance(id) {
      if (!currentUser) { alert('請先登入'); return; }
      const o = ['新接觸','已留電話','已睇樓','二次跟進','落票','成交'];
      try {
        const ref = db.collection('leads').doc(id);
        const snap = await ref.get();
        if (!snap.exists) return; const data = snap.data();
        const i = o.indexOf(data.status);
        const next = o[Math.min(i+1,o.length-1)];
        await ref.update({ status: next });
        fetchLeads();
      } catch (e) { alert('更新失敗：'+e.message); }
    }

    // whatsapp
    function whatsapp(id) {
      const x = leadsCache.find(l => l.id === id);
      if (!x) return;
      const d = (x.phone || '').replace(/\D/g, '');
      const msg = encodeURIComponent(`${x.name || '你好'}，你之前睇過${x.project || '樓盤'}，我整理咗一份按你預算${x.budget || ''}嘅最新資料。你最關心嘅係${x.notes || '價錢同戶型'}，我可以直接發重點俾你。`);
      window.open(`https://wa.me/${d.startsWith('852') ? d : '852' + d}?text=${msg}`, '_blank');
    }

    // render table
    function render() {
      const q = (document.getElementById('search').value || '').toLowerCase();
      const today = new Date().toISOString().slice(0,10);
      const arr = leadsCache.filter(x => JSON.stringify(x).toLowerCase().includes(q));
      document.getElementById('tbody').innerHTML = arr.map(x => `<tr>
        <td><b>${x.name || '未命名'}</b><br>${x.phone || ''}<br><span class="muted">${x.source || ''}</span><br><small class="muted">${x.ownerName ? 'owner: '+x.ownerName : ''}</small></td>
        <td>${x.project || '-'}<br>${x.budget || '-'}｜${x.purpose || '-'}</td>
        <td>${x.grade || 'B'}級<br>${x.status || '新接觸'}</td>
        <td>${x.follow || '未設定'}</td>
        <td>${x.notes || '-'}</td>
        <td>
          <button class="secondary" onclick="whatsapp('${x.id}')">WhatsApp</button>
          <button class="secondary" onclick="advance('${x.id}')">下一階段</button>
          <button class="danger" onclick="removeLead('${x.id}')">刪除</button>
        </td>
      </tr>`).join('');
      document.getElementById('sTotal').textContent = leadsCache.length;
      document.getElementById('sA').textContent = leadsCache.filter(x => x.grade === 'A').length;
      document.getElementById('sDue').textContent = leadsCache.filter(x => x.follow && x.follow <= today && x.status !== '成交').length;
      document.getElementById('sView').textContent = leadsCache.filter(x => ['已睇樓','二次跟進','落票','成交'].includes(x.status)).length;
    }

    // export CSV of visible leads only
    function exportCSV() {
      const h = ['created','name','phone','project','budget','purpose','grade','status','follow','source','notes','ownerUid','ownerName'];
      const esc = v => `"${String(v ?? '').replaceAll('"','""')}"`;
      const csv = '\ufeff' + [h.join(','), ...leadsCache.map(x => h.map(k => esc(x[k])).join(','))].join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = 'property_leads.csv';
      a.click();
    }

    // clear all visible leads (will only clear those allowed by security rules - admin can clear all, owner can clear their own)
    async function clearAll() {
      if (!currentUser) { alert('請先登入'); return; }
      if (!confirm('確定清除全部？')) return;
      try {
        // delete each visible doc
        const batch = db.batch();
        const q = isAdmin ? db.collection('leads').limit(500) : db.collection('leads').where('ownerUid','==',currentUser.uid);
        const snap = await q.get();
        snap.docs.forEach(d => batch.delete(d.ref));
        await batch.commit();
        fetchLeads();
      } catch (e) { alert('清除失敗：'+e.message); }
    }

    // wire events
    addBtn.addEventListener('click', addLead);
    exportBtn.addEventListener('click', exportCSV);
    clearBtn.addEventListener('click', clearAll);

    // initial render
    render();
  </script>
</body>
</html>
